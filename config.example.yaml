# Kopieren nach config.yaml und Werte anpassen -- oder einfach leer lassen
# und alles bequem über das Web-Dashboard unter /settings eintragen.
# Sensible Werte (api_key, smtp.password) können stattdessen auch per
# Umgebungsvariable gesetzt werden: BRAVE_API_KEY, SMTP_PASSWORD

brave:
  api_key: ""
  base_url: "https://api.search.brave.com/res/v1"
  max_requests_per_month: 950  # Sicherheitspuffer unter dem 1000er-Gratislimit

ollama:
  base_url: ""    # z.B. http://192.168.1.10:11434 -- externe, selbst gehostete Ollama-Instanz
  model: ""       # im Dashboard aus den auf der Ollama-Instanz installierten Modellen wählbar
  timeout_seconds: 180

cache:
  db_path: "data/cache.db"
  ttl_hours: 24

budget:
  db_path: "data/budget.db"

output:
  reports_dir: "reports"
  email_to: ""
  email_from: ""
  smtp:
    host: ""       # leer lassen = kein E-Mail-Versand, Report bleibt lokal
    port: 587
    user: ""
    password: ""
    use_tls: true

modules:
  competitor_analysis:
    enabled: true
    branche: ""    # z.B. "Handwerksbetrieb"
    region: ""     # z.B. "Ihr Landkreis"
    queries_extra: []

  news_digest:
    enabled: true
    region: ""
    themen: []     # z.B. ["Energie", "Förderprogramme"]
    stil: "sachlich, lokal, freundlich"
    queries_extra: []

# Frei definierbare, zusätzliche Recherche-Module -- Anlage und Verwaltung
# bequem über das Dashboard unter /modules, kein Code nötig.
custom_modules: []
