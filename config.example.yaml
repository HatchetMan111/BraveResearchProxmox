# Kopieren nach config.yaml und Werte anpassen -- oder einfach leer lassen
# und alles bequem über das Web-Dashboard unter /settings eintragen.
# Sensible Werte (api_key, smtp.password) können stattdessen auch per
# Umgebungsvariable gesetzt werden: BRAVE_API_KEY, SMTP_PASSWORD

brave:
  api_key: ""
  base_url: "https://api.search.brave.com/res/v1"
  max_requests_per_month: 950  # Sicherheitspuffer unter dem 1000er-Gratislimit

ollama:
  base_url: ""    # z.B. http://192.168.1.10:11434 -- externe, selbst gehostete Ollama-Instanz
  model: ""       # im Dashboard aus den auf der Ollama-Instanz installierten Modellen wählbar
  timeout_seconds: 180

cache:
  db_path: "data/cache.db"
  ttl_hours: 24

budget:
  db_path: "data/budget.db"

output:
  reports_dir: "reports"
  email_to: ""
  email_from: ""
  smtp:
    host: ""       # leer lassen = kein E-Mail-Versand, Report bleibt lokal
    port: 587
    user: ""
    password: ""
    use_tls: true

modules:
  competitor_analysis:
    enabled: true
    branche: ""    # z.B. "Handwerksbetrieb"
    region: ""     # z.B. "Ihr Landkreis"
    queries_extra: []
    # Eigener Zeitplan für dieses Modul (optional, bequem über /settings):
    # schedule:
    #   use_default: false  # false = dieser Block gilt statt dem Standard oben
    #   enabled: true       # false = nur manuell über Dashboard
    #   time: "07:30"
    #   frequency: "daily"  # oder "weekly"
    #   weekday: "mon"

  news_digest:
    enabled: true
    region: ""
    themen: []     # z.B. ["Energie", "Förderprogramme"]
    stil: "sachlich, lokal, freundlich"
    queries_extra: []

# Frei definierbare, zusätzliche Recherche-Module -- Anlage und Verwaltung
# bequem über das Dashboard unter /modules, kein Code nötig.
custom_modules: []

# Automatischer Zeitplan: globaler Standard (gilt für alle Module OHNE
# eigenen Zeitplan). Pro Modul kann unter modules.<name>.schedule bzw. bei
# eigenen Modulen über das Dashboard ein eigener Zeitplan gesetzt werden
# (täglich/wöchentlich + Uhrzeit, oder nur manuell). Der Installer erzeugt
# daraus je Modul einen System-Timer (research-lxc-mod-<name>.timer);
# nach Änderungen im Dashboard Installer erneut laufen lassen oder als root:
#   cd /opt/research-lxc && venv/bin/python -m app.schedule_units --config config.yaml --apply
schedule:
  enabled: true
  time: "06:00"      # HH:MM (24h) -- Standard-Uhrzeit
  frequency: "daily" # "daily" oder "weekly"
  weekday: "mon"     # nur bei frequency=weekly: mon, tue, wed, thu, fri, sat, sun
